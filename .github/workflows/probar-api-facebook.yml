name: Probar API con Facebook login
on:
  workflow_dispatch:
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test-fb-login.mjs
        env:
          META_TOKEN: ${{ secrets.TOKEN_ORG_ADS }}
