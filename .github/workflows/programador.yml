name: Programador
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: programador
jobs:
  cola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/run-queue.mjs
        env:
          META_TOKEN: ${{ secrets.TOKEN_ORG_ADS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
