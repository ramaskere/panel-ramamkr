name: Historias diarias
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: historias-diarias
jobs:
  rotacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/rotacion-historias.mjs
        env:
          META_TOKEN: ${{ secrets.TOKEN_ORG_ADS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
