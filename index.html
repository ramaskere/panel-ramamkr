<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel RamaMKR</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: barra superior con pestañas, contenido en una columna ancha; tablas con scroll propio.
   Paleta dark-first de ramaruizmkt (negro, azul de marca), con variante clara. */
:root {
  --bg: #050505; --surface: #0e0e10; --raise: #151518; --line: rgba(255,255,255,.09);
  --fg: #f4f4f5; --muted: #8f8f94; --accent: #0a84ff; --accent-ink: #ffffff;
  --good: #30d158; --warn: #ffb340; --bad: #ff453a;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f5f6f8; --surface: #ffffff; --raise: #eef0f4; --line: rgba(0,0,0,.1);
  --fg: #0b0b0d; --muted: #62626a; --accent: #0066d6; --accent-ink: #ffffff;
  --good: #1c8a3a; --warn: #a96300; --bad: #c8261c; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #f5f6f8; --surface: #ffffff; --raise: #eef0f4; --line: rgba(0,0,0,.1);
  --fg: #0b0b0d; --muted: #62626a; --accent: #0066d6; --accent-ink: #ffffff;
  --good: #1c8a3a; --warn: #a96300; --bad: #c8261c; color-scheme: light; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; padding-inline: 16px; padding-block: 0 56px; }
.tools { display: flex; align-items: center; gap: 10px; }
#sync { font-size: 12px; color: var(--muted); }
#cuenta-sel { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-weight: 600; max-width: 190px; }
#sync.bad { color: var(--bad); }
.setup { max-width: 460px; display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
.setup p { margin: 0; color: var(--muted); }
.setup .field input { width: 100%; }
.wrap { max-width: 1120px; margin: 0 auto; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); margin-inline: -16px; padding: 12px 16px 0; }
.bar { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; justify-content: space-between; }
.brand { font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
nav { display: flex; gap: 4px; overflow-x: auto; max-width: 1120px; margin: 8px auto 0; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); font-weight: 600; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
nav button:hover { color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
.ghost:hover { background: var(--raise); }
.danger { color: var(--bad); }

main { padding-top: 24px; display: flex; flex-direction: column; gap: 28px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.hint { color: var(--muted); font-size: 13px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi b { font-size: 24px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: 12px; }
.kpi .eyebrow { font-size: 10.5px; }

.funnel { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.frow { display: grid; grid-template-columns: 84px 1fr 120px; gap: 12px; align-items: center; }
.frow .track { background: var(--raise); border-radius: 6px; height: 22px; overflow: hidden; }
.frow .fill { height: 100%; background: var(--accent); border-radius: 6px; min-width: 2px; }
.frow:nth-child(2) .fill { opacity: .75; } .frow:nth-child(3) .fill { background: var(--good); }
.frow span:last-child { color: var(--muted); font-size: 12.5px; text-align: right; }
.frow span:first-child { font-weight: 600; }

.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th { text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover { background: var(--raise); }
td .sub { color: var(--muted); font-size: 12px; }
td.title { max-width: 280px; overflow-wrap: anywhere; }
.dim { color: var(--muted); }

.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--raise); color: var(--muted); white-space: nowrap; }
.pill.contactado, .pill.Activa { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.pill.Activo { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.pill.agendado, .pill.Pausada, .pill.Pausado { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.pill.venta { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.pill.perdido { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
select.stage { background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font-size: 13px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.empty p { margin: 0; color: var(--muted); max-width: 52ch; }
.empty h3 { font-size: 16px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; overflow-y: auto; z-index: 20; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 520px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.modal h3 { font-size: 17px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; width: 100%; min-width: 0; }
.field.check { flex-direction: row; align-items: center; gap: 8px; }
.field.check input { width: auto; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions .sp { flex: 1; }
.err { color: var(--bad); font-size: 13px; min-height: 1em; }
/* calendario */
.cal-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-head h2 { text-transform: none; min-width: 150px; }
.cal-head h2::first-letter { text-transform: uppercase; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cal-dow { background: var(--surface); padding: 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cal-day { background: var(--surface); min-height: 104px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal-day.off { background: var(--bg); }
.cal-n { font-size: 12px; font-weight: 700; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.cal-day.today .cal-n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; }
.cal-chip { text-align: left; border: 0; border-radius: 7px; padding: 4px 6px; font-size: 12px; line-height: 1.25; cursor: pointer; background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--fg); min-width: 0; overflow: hidden; }
.cal-chip b { display: block; font-variant-numeric: tabular-nums; font-size: 11px; color: var(--accent); }
.cal-chip.publicado { background: color-mix(in srgb, var(--good) 20%, transparent); } .cal-chip.publicado b { color: var(--good); }
.cal-chip.error, .cal-chip.vencido { background: color-mix(in srgb, var(--bad) 20%, transparent); } .cal-chip.error b, .cal-chip.vencido b { color: var(--bad); }
.cal-chip.publicando { background: color-mix(in srgb, var(--warn) 22%, transparent); } .cal-chip.publicando b { color: var(--warn); }
.cal-chip span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill.pendiente { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.pill.publicado { background: color-mix(in srgb, var(--good) 20%, transparent); color: var(--good); }
.pill.error, .pill.vencido { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.pill.publicando { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.thumbs { display: flex; gap: 6px; overflow-x: auto; }
.thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; flex: none; }
.cap { white-space: pre-wrap; color: var(--muted); font-size: 13px; max-height: 220px; overflow-y: auto; }
@media (max-width: 700px) { .cal-day { min-height: 56px; padding: 4px; } .cal-chip span, .cal-chip b { display: none; } .cal-chip { padding: 0; height: 8px; } .cal-dow { padding: 6px 2px; font-size: 10px; text-align: center; letter-spacing: 0; } }
@media (max-width: 520px) { .fields { grid-template-columns: 1fr; } .frow { grid-template-columns: 70px 1fr 90px; gap: 8px; } }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .3s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="bar">
      <div class="brand">Panel <span>RamaMKR</span></div>
      <div class="tools"><select id="cuenta-sel" aria-label="Cuenta de Instagram" hidden></select><span id="sync" role="status"></span><button class="ghost" id="cfg-btn" type="button">Conexión</button><button class="primary" id="add-btn" type="button">+ Nuevo lead</button></div>
    </div>
    <nav role="tablist" id="tabs"></nav>
  </header>
  <main id="view"></main>
</div>
<div id="modal-root"></div>

<script>
const STAGES = [['nuevo','Nuevo'],['contactado','Contactado'],['agendado','Agendado'],['venta','Venta'],['perdido','Perdido']];
const STAGE_LABEL = Object.fromEntries(STAGES);
const TABS = [['resumen','Resumen','+ Nuevo lead','leads'],['calendario','Calendario','+ Nuevo lead','leads'],['leads','Leads','+ Nuevo lead','leads'],['organico','Orgánico','+ Nuevo contenido','posts'],['campanas','Campañas','+ Nueva campaña','camps'],['recursos','Recursos','+ Nuevo recurso','recursos']];
const COLL = { leads:'leads', posts:'posts', camps:'camps', recursos:'recursos', config:'config' };
const S = { posts: [], camps: [], leads: [], recursos: [], config: [] };
let LISTA = [], cuentaSel = 'todas';
try { cuentaSel = localStorage.getItem('panel-cuenta') || 'todas'; } catch (e) {}
const cuentaDe = x => String((x && x.cuenta) || LISTA[0] || '').toLowerCase();
const okCuenta = x => cuentaSel === 'todas' || !LISTA.length || cuentaDe(x) === cuentaSel;
const cuentaField = () => LISTA.length > 1 ? [['cuenta', 'Cuenta', 'select', { full: 1, opts: LISTA.map(u => [u, '@' + u]), def: cuentaSel !== 'todas' ? cuentaSel : LISTA[0] }]] : [];
let db = null, tab = 'resumen', leadFilter = 'todos', dbError = '', needSetup = false;
const CFG_KEY = 'panel-ramamkr-conexion';
const cfg = { repo: 'ramaskere/panel-ramamkr', file: 'datos.enc.json', pass: '', token: '' };
try { Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem(CFG_KEY, JSON.stringify({ pass: cfg.pass, token: cfg.token })); } catch (e) {} try { navigator.storage?.persist?.(); } catch (e) {} };
const authErr = m => Object.assign(new Error(m), { auth: true });

try { const t = localStorage.getItem('panel-tab'); if (TABS.some(x => x[0] === t)) tab = t; } catch (e) {}

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const n0 = v => Number(v) || 0;
const int = v => n0(v).toLocaleString('es');
const money = v => 'US$ ' + n0(v).toLocaleString('es', { maximumFractionDigits: Math.abs(n0(v)) < 100 ? 2 : 0 });
const ratio = (a, b) => b > 0 ? a / b : null;
const pct = r => r === null ? '—' : (r * 100).toLocaleString('es', { maximumFractionDigits: 1 }) + '%';
const moneyOr = r => r === null ? '—' : money(r);
const dateLabel = f => f ? new Date(f + 'T12:00:00').toLocaleDateString('es', { day: 'numeric', month: 'short' }) : '—';

/* ---------- métricas ---------- */
const isAgenda = l => !!l.agendado || l.etapa === 'agendado' || l.etapa === 'venta';
function stats(list) {
  const ventas = list.filter(l => l.etapa === 'venta');
  return { leads: list.length, agendas: list.filter(isAgenda).length, ventas: ventas.length, ingresos: ventas.reduce((s, l) => s + n0(l.monto), 0) };
}
const byOrigin = key => stats(S.leads.filter(l => (l.origen || 'directo') === key));
function originName(key) {
  if (!key || key === 'directo') return 'Directo / otro';
  const [t, id] = key.split(':');
  const d = (t === 'post' ? S.posts : t === 'rec' ? S.recursos : S.camps).find(x => x.id === id);
  if (!d) return 'Origen eliminado';
  return t === 'post' ? (d.titulo || 'Sin título') : (d.nombre || 'Sin nombre');
}
const originKind = key => !key || key === 'directo' ? 'Directo' : key.startsWith('post:') ? 'Orgánico' : key.startsWith('rec:') ? 'Lead magnet' : 'Campaña';

/* ---------- vistas ---------- */
function kpi(label, value, sub) { return `<div class="kpi"><span class="eyebrow">${label}</span><b>${value}</b><small>${sub || '&nbsp;'}</small></div>`; }
function table(heads, rows, emptyMsg) {
  return `<div class="tablebox"><table><thead><tr>${heads.map(h => `<th class="${h[1] || ''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="${heads.length}" class="dim">${emptyMsg}</td></tr>`}</tbody></table></div>`;
}

function viewResumen() {
  const hasAny = S.leads.length || S.posts.length || S.camps.length;
  if (!hasAny) return `<div class="empty"><h3>Todavía no hay datos</h3><p>Empieza cargando un contenido orgánico o una campaña, y después tus leads con su origen. El resumen se arma solo a partir de eso.</p><div class="actions"><button class="primary" data-new="posts">+ Contenido</button><button class="ghost" data-new="camps">+ Campaña</button><button class="ghost" data-new="leads">+ Lead</button><button class="ghost" id="seed">Ver con datos de ejemplo</button></div></div>`;
  const t = stats(S.leads);
  const gasto = S.camps.reduce((s, c) => s + n0(c.gasto), 0);
  const campLeads = S.leads.filter(l => (l.origen || '').startsWith('camp:'));
  const cs = stats(campLeads);
  const f = (a, b, c) => `<div class="frow"><span>${a}</span><div class="track"><div class="fill" style="width:${t.leads ? Math.max(b / t.leads * 100, 0) : 0}%"></div></div><span class="num">${c}</span></div>`;

  const groups = [['Orgánico', S.leads.filter(l => (l.origen || '').startsWith('post:'))], ['Campañas', campLeads], ['Lead magnets', S.leads.filter(l => (l.origen || '').startsWith('rec:'))], ['Directo / otro', S.leads.filter(l => !l.origen || l.origen === 'directo')]];
  const gRows = groups.map(([n, list]) => { const s = stats(list); return `<tr><td>${n}</td><td class="r">${s.leads}</td><td class="r">${s.agendas}</td><td class="r">${s.ventas}</td><td class="r">${money(s.ingresos)}</td><td class="r">${pct(ratio(s.ventas, s.leads))}</td></tr>`; });

  const origins = [...S.posts.map(p => ['post:' + p.id, 'Orgánico']), ...S.camps.map(c => ['camp:' + c.id, 'Campaña']), ...S.recursos.map(r => ['rec:' + r.id, 'Lead magnet'])]
    .map(([k, kind]) => ({ k, kind, ...byOrigin(k) })).filter(o => o.leads > 0)
    .sort((a, b) => b.ingresos - a.ingresos || b.leads - a.leads).slice(0, 6);
  const oRows = origins.map(o => `<tr><td class="title">${esc(originName(o.k))}<div class="sub">${o.kind}</div></td><td class="r">${o.leads}</td><td class="r">${o.agendas}</td><td class="r">${o.ventas}</td><td class="r">${money(o.ingresos)}</td></tr>`);

  const months = {};
  S.leads.forEach(l => { const m = (l.fecha || '').slice(0, 7) || 'sin fecha'; (months[m] ||= []).push(l); });
  const mRows = Object.keys(months).sort().reverse().map(m => { const s = stats(months[m]); const lab = m === 'sin fecha' ? m : new Date(m + '-15T12:00:00').toLocaleDateString('es', { month: 'long', year: 'numeric' }); return `<tr><td style="text-transform:capitalize">${lab}</td><td class="r">${s.leads}</td><td class="r">${s.agendas}</td><td class="r">${s.ventas}</td><td class="r">${money(s.ingresos)}</td></tr>`; });
  const hasEj = [...S.posts, ...S.camps, ...S.leads].some(d => d.ejemplo);

  return `
  <section class="sec"><div class="sec-head"><h2>Negocio</h2>${hasEj ? '<button class="ghost danger" id="unseed">Borrar datos de ejemplo</button>' : ''}</div>
    <div class="kpis">
      ${kpi('Leads', int(t.leads), `${pct(ratio(t.agendas, t.leads))} agendan`)}
      ${kpi('Agendas', int(t.agendas), `${pct(ratio(t.ventas, t.agendas))} cierran`)}
      ${kpi('Ventas', int(t.ventas), `${pct(ratio(t.ventas, t.leads))} de los leads`)}
      ${kpi('Ingresos', money(t.ingresos), t.ventas ? `Ticket ${money(t.ingresos / t.ventas)}` : '')}
    </div>
    <div class="kpis">
      ${kpi('Inversión en ads', money(gasto), `${S.camps.length} campañas`)}
      ${kpi('Costo por lead', moneyOr(ratio(gasto, cs.leads)), `${cs.leads} leads de campañas`)}
      ${kpi('Costo por venta', moneyOr(ratio(gasto, cs.ventas)), `${cs.ventas} ventas de campañas`)}
      ${kpi('ROAS', cs.ingresos && gasto ? (cs.ingresos / gasto).toLocaleString('es', { maximumFractionDigits: 2 }) + 'x' : '—', `${money(cs.ingresos)} facturado`)}
    </div></section>
  <section class="sec"><div class="sec-head"><h2>Embudo</h2><span class="hint">Todos los leads cargados</span></div>
    <div class="funnel">${f('Leads', t.leads, int(t.leads))}${f('Agendas', t.agendas, `${t.agendas} · ${pct(ratio(t.agendas, t.leads))}`)}${f('Ventas', t.ventas, `${t.ventas} · ${pct(ratio(t.ventas, t.leads))}`)}</div></section>
  <div class="two">
    <section class="sec"><div class="sec-head"><h2>Por canal</h2></div>${table([['Canal'], ['Leads', 'r'], ['Agendas', 'r'], ['Ventas', 'r'], ['Ingresos', 'r'], ['Conv.', 'r']], gRows)}</section>
    <section class="sec"><div class="sec-head"><h2>Por mes</h2><span class="hint">Según fecha del lead</span></div>${table([['Mes'], ['Leads', 'r'], ['Agendas', 'r'], ['Ventas', 'r'], ['Ingresos', 'r']], mRows, 'Sin leads')}</section>
  </div>
  <section class="sec"><div class="sec-head"><h2>Qué te está trayendo resultados</h2><span class="hint">Contenidos y campañas ordenados por ingresos</span></div>

let cola = [], calMonth = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(), calList = [];
const ESTADO_COLA = { pendiente: 'Programado', publicando: 'Publicando', publicado: 'Publicado', error: 'Error', vencido: 'Vencido' };
function calItems() {
  const items = [];
  const diaDe = d => d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  const postDias = new Set(S.posts.filter(p => p.fecha).map(p => diaDe(new Date(p.fecha + 'T12:00:00'))));
  for (const c of cola) {
    if (!okCuenta(c)) continue;
    const d = new Date(c.fecha); if (isNaN(d)) continue;
    if (c.estado === 'publicado' && postDias.has(diaDe(d))) continue; // ya aparece desde Instagram
    items.push({ date: d, hora: true, estado: c.estado || 'pendiente', titulo: (c.caption || '').split('\n')[0].slice(0, 70), cola: c, cuenta: cuentaDe(c) });
  }
  for (const p of S.posts) if (p.fecha) items.push({ date: new Date(p.fecha + 'T12:00:00'), hora: false, estado: 'publicado', titulo: p.titulo || 'Sin título', post: p, cuenta: cuentaDe(p) });
  return items.sort((a, b) => a.date - b.date);
}
function viewCalendario() {

  calList = calItems().filter(it => it.date.getFullYear() === y && it.date.getMonth() === m);
  const porDia = {}; calList.forEach((it, i) => (porDia[it.date.getDate()] ||= []).push([it, i]));
  const hora = it => it.hora ? it.date.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }) : 'Publicado';
  const chip = ([it, i]) => `<button class="cal-chip ${esc(it.estado)}" data-cal="${i}" title="${esc(it.titulo)}"><b>${esc(hora(it))}</b><span>${esc(it.titulo)}</span></button>`;
  let cells = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < offset; i++) cells += '<div class="cal-day off"></div>';
  for (let d = 1; d <= dias; d++) cells += `<div class="cal-day${hoy.getFullYear() === y && hoy.getMonth() === m && hoy.getDate() === d ? ' today' : ''}"><span class="cal-n">${d}</span>${(porDia[d] || []).map(chip).join('')}</div>`;
  const rows = calList.map((it, i) => `<tr class="click" data-cal="${i}"><td class="dim">${it.date.toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' })}${it.hora ? ' · ' + esc(hora(it)) : ''}</td><td class="title">${esc(it.titulo)}<div class="sub">${it.cola ? (it.cola.imagenes || []).length + ' imágenes' : esc(it.post.formato || '')}${LISTA.length > 1 ? ' · @' + esc(it.cuenta) : ''}</div></td><td><span class="pill ${esc(it.estado)}">${esc(ESTADO_COLA[it.estado] || it.estado)}</span></td></tr>`);

    <div class="cal-grid">${cells}</div></section>
    <section class="sec"><div class="sec-head"><h2>Lista del mes</h2><span class="hint">Para cambiar o cancelar un post programado, pídeselo a Claude antes de su hora.</span></div>${table([['Fecha'], ['Contenido'], ['Estado']], rows, 'No hay publicaciones este mes.')}</section>`;

    if (!id) data.creado = Date.now();
    try { await db.collection(COLL[kind]).doc(id || undefined).set(data); close(); }
    catch (err) { $('#err').textContent = 'No se pudo guardar: ' + (err.message || err.code); }
  };
}

async function unseed() {

/* ---------- almacenamiento: archivo cifrado en el repo de GitHub ---------- */
const GH = 'https://api.github.com/repos/';
let remote = { data: { posts: {}, camps: {}, leads: {} }, sha: null }, unsaved = [], saving = false, saveTimer = null;
const b64 = u8 => btoa(String.fromCharCode(...new Uint8Array(u8)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const utf8b64 = s => btoa(unescape(encodeURIComponent(s)));
const b64utf8 = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ''))));
const setSync = (msg, bad) => { const el = $('#sync'); el.textContent = msg; el.className = bad ? 'bad' : ''; };
const ghHeaders = () => ({ Accept: 'application/vnd.github+json', ...(cfg.token ? { Authorization: 'Bearer ' + cfg.token } : {}) });

async function deriveKey(salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(cfg.pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encrypt(obj, salt) {
  const iv = crypto.getRandomValues(new Uint8Array(12)), key = await deriveKey(salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({ v: 1, salt: b64(salt), iv: b64(iv), ct: b64(ct) });
}
async function decrypt(text) {
  const f = JSON.parse(text), key = await deriveKey(unb64(f.salt));
  try { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(f.iv) }, key, unb64(f.ct)))); }
  catch (e) { throw authErr('La contraseña no coincide con la de tus datos.'); }
}
let salt = null;

async function load() {
  const r = await fetch(`${GH}${cfg.repo}/contents/${cfg.file}?t=${Date.now()}`, { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 404) { remote = { data: { posts: {}, camps: {}, leads: {} }, sha: null }; return; }
  if (r.status === 401) throw authErr('El token no es válido o venció.');
  if (!r.ok) throw new Error('GitHub respondió ' + r.status + '.');
  const j = await r.json();
  const data = await decrypt(b64utf8(j.content));
  salt = unb64(JSON.parse(b64utf8(j.content)).salt);
  remote = { data: { posts: {}, camps: {}, leads: {}, ...data }, sha: j.sha };
}
function publish() {
  LISTA = ((remote.data.config || {}).cuentas || {}).lista || [];
  LISTA = LISTA.map(x => String(x).toLowerCase());
  if (cuentaSel !== 'todas' && !LISTA.includes(cuentaSel)) cuentaSel = 'todas';
  for (const c of ['posts', 'camps', 'leads', 'recursos', 'config']) {
    const todos = Object.entries(remote.data[c] || {}).map(([id, v]) => ({ id, ...v }));
    S[c] = c === 'config' ? todos : todos.filter(okCuenta);
  }
}
const applyOp = (d, o) => { d[o.c] ||= {}; if (o.t === 'set') d[o.c][o.id] = o.d; else delete d[o.c][o.id]; };
function mutate(o) {
  if (!cfg.token) throw new Error('Falta el token de GitHub. Toca "Conexión" para agregarlo y poder guardar.');
  applyOp(remote.data, o); unsaved.push(o); publish();
  if (!document.querySelector('#form')) render();
  setSync('Sin guardar…'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 800);
}
async function flush() {
  if (saving || !unsaved.length) return;
  saving = true; setSync('Guardando…');
  try {
    while (unsaved.length) {
      const n = unsaved.length;
      salt ||= crypto.getRandomValues(new Uint8Array(16));
      const body = { message: 'Actualiza datos', content: btoa(await encrypt(remote.data, salt)) };
      if (remote.sha) body.sha = remote.sha;
      const r = await fetch(`${GH}${cfg.repo}/contents/${cfg.file}`, { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
      if (r.ok) { remote.sha = (await r.json()).content.sha; unsaved.splice(0, n); }
      else if (r.status === 409 || r.status === 422) { const ops = unsaved.slice(); await load(); ops.forEach(o => applyOp(remote.data, o)); }
      else if (r.status === 401 || r.status === 403 || r.status === 404) throw new Error('El token no tiene permiso para escribir en ' + cfg.repo + '.');
      else throw new Error('GitHub respondió ' + r.status + '.');
    }
    publish(); render(); setSync('Guardado ' + new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) { setSync('No se pudo guardar: ' + e.message, true); }
  saving = false;
}
const newId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dbShim = { collection: c => ({ doc: id => { id = id || newId(); return {
  set: async d => mutate({ t: 'set', c, id, d }),
  update: async p => mutate({ t: 'set', c, id, d: { ...remote.data[c][id], ...p } }),
  delete: async () => mutate({ t: 'del', c, id }) }; } }) };

/* ---------- arranque ---------- */
async function init() {
  if (!cfg.pass) { needSetup = true; render(); return; }
  needSetup = false; dbError = ''; setSync('Cargando…'); loadCola().then(() => { if (tab === 'calendario') render(); });
  try { await load(); publish(); db = dbShim; setSync(cfg.token ? 'Sincronizado' : 'Solo lectura'); }
  catch (e) { needSetup = !!e.auth; dbError = e.message; setSync(e.auth ? '' : 'Sin conexión con GitHub', !e.auth); }
  render();
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'setup-form') return;
  e.preventDefault();
  cfg.pass = $('#s-pass').value; cfg.token = $('#s-token').value.trim(); salt = null; saveCfg(); init();
});
document.addEventListener('click', e => {
  if (e.target.closest('#retry')) init();
  else if (e.target.closest('#cfg-btn')) { needSetup = true; dbError = ''; render(); }
  else if (e.target.closest('#forget')) { cfg.pass = ''; cfg.token = ''; try { localStorage.removeItem(CFG_KEY); } catch (x) {} S.posts = S.camps = S.leads = []; remote.data = { posts: {}, camps: {}, leads: {} }; db = null; needSetup = true; render(); }
});
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !db || saving || unsaved.length || document.querySelector('#form') || needSetup) return;
  try { await load(); publish(); await loadCola(); render(); } catch (e) {}
});
window.addEventListener('beforeunload', e => { if (unsaved.length) { e.preventDefault(); e.returnValue = ''; } });
try { if (cfg.pass) navigator.storage?.persist?.(); } catch (e) {}
render();
init();
</script>
