name: Responder comentarios
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot-comentarios
jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/responder-comentarios.mjs
        env:
          META_TOKEN: ${{ secrets.TOKEN_ORG_ADS }}
          DATA_PASS: ${{ secrets.DATA_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_USERNAME: ${{ vars.IG_USERNAME }}
